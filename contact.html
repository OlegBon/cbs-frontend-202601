<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Contact</title>
  </head>
  <body>
    <header class="main-header">
      <nav class="menu">
        <button class="burger" aria-label="Menu"></button>

        <div class="menu__list">
          <a href="./index.html">Home</a>
          <a href="./blog.html">Blog</a>
          <a href="./works.html">Works</a>
          <a href="./contact.html" class="active">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <div class="container">
        <section class="contact-section">
          <h1 class="h1-style">Contact</h1>

          <div class="contact-content">
            <div class="contact-info">
              <p class="contact-text">
                I'm always interested in hearing about new projects and
                opportunities. You can reach out to me via email or fill out the
                form below.
              </p>

              <div class="contact-links">
                <a href="mailto:email@example.com" class="contact-link">
                  email@example.com
                </a>
              </div>
            </div>

            <form
              class="contact-form"
              action="https://formspree.io/f/mgolavor"
              method="POST"
            >
              <div class="form-group">
                <label for="name">Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Your Name"
                  required
                />
              </div>

              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="email@example.com"
                  required
                />
              </div>

              <div class="form-group">
                <label for="message">Message</label>
                <textarea
                  id="message"
                  name="message"
                  rows="5"
                  placeholder="Your message here..."
                  required
                ></textarea>
              </div>

              <!-- <input
                type="hidden"
                name="_subject"
                value="Нове повідомлення з Портфоліо!"
              /> -->

              <input
                type="hidden"
                name="_next"
                value="https://olegbon.github.io/cbs-frontend-202601/index.html"
              />
              <input type="hidden" name="_next" value="./index.html" />

              <button type="submit" class="hero__button">Send Message</button>
            </form>
          </div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="socials">
          <a href="#" aria-label="Facebook" class="icon fb"></a>
          <a href="#" aria-label="Instagram" class="icon insta"></a>
          <a href="#" aria-label="X" class="icon x"></a>
          <a href="#" aria-label="LinkedIn" class="icon linkedin"></a>
        </div>
        <p class="footer__text">Copyright ©2020 All rights reserved</p>
      </div>
    </footer>

    <script src="./scripts/main.js"></script>
  </body>
</html>
